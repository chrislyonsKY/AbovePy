[project]
site_name        = "abovepy"
site_description = "KyFromAbove LiDAR, DEM, and orthoimagery access for Python"
site_author      = "Chris Lyons"
site_url         = "https://chrislyonsKY.github.io/AbovePy/"
repo_url         = "https://github.com/chrislyonsKY/AbovePy"
repo_name        = "chrislyonsKY/AbovePy"
edit_uri         = "edit/main/docs/"

nav = [
    { "Home"                    = "index.md" },
    { "Getting Started"         = "getting-started.md" },
    { "Tutorials" = [
        { "DEM + Hillshade"         = "tutorials/dem-hillshade.md" },
        { "LiDAR Access"            = "tutorials/lidar-access.md" },
        { "Web Maps (TiTiler)"      = "tutorials/titiler-maps.md" },
        { "ArcGIS Pro Toolbox"      = "tutorials/arcgis-pro.md" },
        { "Troubleshooting"         = "tutorials/troubleshooting.md" },
    ]},
    { "KyFromAbove Collections" = "stac-collections.md" },
    { "Architecture"            = "architecture.md" },
    { "API Reference" = [
        { "Overview"                    = "api/reference.md" },
        { "Client"                      = "api/client.md" },
        { "Products"                    = "api/products.md" },
        { "I/O (Raster & Point Cloud)"  = "api/io.md" },
        { "TiTiler URL Helpers"         = "api/titiler.md" },
        { "Utilities"                   = "api/utils.md" },
        { "Exceptions"                  = "api/exceptions.md" },
    ]},
]

# ── Theme ────────────────────────────────────────────────────────────────────

[project.theme]
variant  = "classic"
features = [
    "navigation.tabs",
    "navigation.top",
    "navigation.instant",
    "search.highlight",
    "search.suggest",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme  = "default"
primary = "teal"
accent  = "teal"
toggle  = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme  = "slate"
primary = "teal"
accent  = "light green"
toggle  = { icon = "material/brightness-4", name = "Switch to light mode" }

# ── Social links ─────────────────────────────────────────────────────────────

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/chrislyonsKY/AbovePy" },
]

# ── Plugins ──────────────────────────────────────────────────────────────────

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source        = false
docstring_style    = "numpy"
show_root_heading  = true
show_root_full_path = false
heading_level      = 3
members_order      = "source"

# ── Markdown extensions ───────────────────────────────────────────────────────

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name  = "mermaid"
class = "mermaid"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.emoji]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
